name: CI (Synthetic & Unit Suite)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run data-free unit, hygiene, and API contract tests
        run: |
          pytest -q \
            tests/test_metrics.py \
            tests/test_splits_no_leakage.py \
            tests/test_features_no_future.py \
            tests/test_twin_schema.py \
            tests/test_twin3d_api.py \
            tests/test_run_v3_reproducibility.py \
            tests/test_twin_alerts.py \
            tests/test_twin3d_ui.py
