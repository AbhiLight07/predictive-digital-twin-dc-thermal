# Evaluation Protocol — Frozen after Phase 2
# WARNING: Do not modify after freezing without logging the reason in docs/decisions.md

protocol_frozen: true
protocol_frozen_date: "2026-11-12"
protocol_frozen_commit: "6909f1885a914c7f8ac13aa9ec2f1e421846f8ed"

splits:
  A_chronological:
    description: "Global time cutoff per cluster; 70% train, 10% validation, 20% test"
    train_fraction: 0.70
    val_fraction: 0.10
    test_fraction: 0.20
    embargo_gap: 36  # 36 steps of 10 min = 6 hours
  B_group_kfold:
    description: "5-fold GroupKFold by physical server; stratified by mean CPU load"
    n_splits: 5
    stratify_by: "mean_cpu_load"
  C_strict:
    description: "Unseen servers (20% held-out) evaluated at strictly later time (final 20% test duration)"
    holdout_fraction: 0.20
    embargo_gap: 36  # 36 steps of 10 min = 6 hours

horizons_minutes: [10, 60, 360]  # 10min, 1h, 6h

metrics:
  - MAE
  - RMSE
  - skill_score_vs_persistence

reporting:
  per_server_stats: [median, IQR, worst_decile]
  global_stats: [mean, std]
