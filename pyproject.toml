[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-digital-twin-dc-thermal"
version = "0.1.0"
description = "Predictive Digital Twin for Data Centre Thermal Management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "scikit-learn>=1.2.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "shap>=0.42.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.25.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
