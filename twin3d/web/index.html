<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predictive Digital Twin — 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
#banner{position:fixed;top:0;left:0;right:0;background:rgba(30,30,40,0.92);
  color:#fdae61;text-align:center;padding:6px 12px;font-size:12px;z-index:100;
  border-bottom:1px solid #333}
#canvas-container{position:fixed;top:30px;left:0;right:300px;bottom:0}
canvas{display:block;width:100%;height:100%}
#panel{position:fixed;top:30px;right:0;width:300px;bottom:0;
  background:rgba(18,18,24,0.95);border-left:1px solid #333;
  overflow-y:auto;padding:12px;font-size:12px;z-index:50}
#panel h3{color:#5ec962;margin:8px 0 4px;font-size:13px}
#panel .row{display:flex;justify-content:space-between;padding:2px 0}
#panel .row .label{color:#999}
#panel .row .val{color:#e0e0e0;font-variant-numeric:tabular-nums}
#controls{position:fixed;bottom:0;left:0;right:300px;
  background:rgba(18,18,24,0.95);border-top:1px solid #333;
  padding:8px 16px;display:flex;gap:12px;align-items:center;z-index:50;font-size:12px}
#controls label{color:#999}
#controls select,#controls input[type=range]{background:#222;color:#e0e0e0;
  border:1px solid #444;padding:2px 6px;border-radius:3px}
#controls button{background:#3b528b;color:#e0e0e0;border:none;padding:4px 10px;
  border-radius:3px;cursor:pointer}
#controls button:hover{background:#5ec962;color:#111}
#time-display{color:#fde725;font-variant-numeric:tabular-nums;min-width:160px}
.legend-bar{height:12px;border-radius:2px;margin:4px 0;
  background:linear-gradient(to right,#440154,#3b528b,#21918c,#5ec962,#fde725)}
.legend-labels{display:flex;justify-content:space-between;font-size:10px;color:#777}
#fps-counter{position:fixed;top:34px;left:8px;color:#666;font-size:11px;z-index:60}
#accuracy-panel{background:rgba(30,30,40,0.9);border:1px solid #444;
  border-radius:4px;padding:8px;margin-top:8px}
#accuracy-panel .metric{font-size:11px;padding:1px 0}
.risk-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
#compare-toggle{margin-left:auto}
#whatif-section{margin-top:8px;border-top:1px solid #333;padding-top:8px}
#whatif-section input[type=range]{width:100%}
.alert-list{max-height:120px;overflow-y:auto;margin-top:4px}
.alert-item{padding:2px 4px;border-radius:2px;margin:1px 0;font-size:11px}
.alert-item.warning{background:rgba(253,174,97,0.15);border-left:3px solid #fdae61}
.alert-item.critical{background:rgba(215,25,28,0.15);border-left:3px solid #d7191c}
</style>
</head>
<body>
<div id="banner">Offline replay of recorded telemetry – schematic layout, not physical rack positions – thresholds illustrative</div>
<div id="canvas-container"></div>
<div id="fps-counter">-- fps</div>

<div id="panel">
  <h3>🏢 Fleet Overview</h3>
  <div id="fleet-summary"></div>
  <div id="accuracy-panel">
    <div class="metric" id="metric-mae">MAE: --</div>
    <div class="metric" id="metric-coverage">Coverage: --</div>
    <div class="metric" id="metric-persist">vs Persistence: --</div>
  </div>
  <h3>🌡️ Temperature Scale</h3>
  <div class="legend-bar"></div>
  <div class="legend-labels"><span id="legend-lo">--</span><span id="legend-hi">--</span></div>
  <h3>⚠️ Alerts</h3>
  <div class="alert-list" id="alert-list"><em>no alerts</em></div>
  <h3 id="host-detail-title">🖥️ Select a server</h3>
  <div id="host-detail"></div>
  <div id="whatif-section">
    <h3>🔮 What-If (Planning)</h3>
    <label>CPU Load %</label>
    <input type="range" id="whatif-load" min="0" max="100" value="50">
    <div id="whatif-result"></div>
  </div>
</div>

<div id="controls">
  <label>Cluster</label>
  <select id="sel-cluster"><option value="d1">Cluster 1 (D1)</option><option value="d2">Cluster 2 (D2)</option></select>
  <label>Horizon</label>
  <select id="sel-horizon"><option value="1">10 min (h=1)</option><option value="6">1 hour (h=6)</option><option value="36">6 hours (h=36)</option></select>
  <label>Camera</label>
  <select id="sel-camera"><option value="overview">Overview</option><option value="c1">Cluster 1</option><option value="c2">Cluster 2</option><option value="selected">Selected</option></select>
  <button id="btn-prev">◀</button>
  <span id="time-display">--</span>
  <button id="btn-next">▶</button>
  <button id="btn-play">▶ Play</button>
  <label id="compare-toggle"><input type="checkbox" id="chk-compare"> Compare</label>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
